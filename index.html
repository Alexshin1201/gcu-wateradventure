/* ============================================================================
 * Web Audio Game Sound Engine: Cheerful Game BGM + Crisp SFX (Default OFF)
 * ============================================================================ */
function useGameAudio() {
  const [sfxEnabled, setSfxEnabled] = useState(false);
  const [bgmEnabled, setBgmEnabled] = useState(false);
  const ctxRef = useRef(null);
  const bgmIntervalRef = useRef(null);
  const stepRef = useRef(0);

  const getCtx = useCallback(() => {
    if (typeof window === 'undefined') return null;
    try {
      if (!ctxRef.current) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) ctxRef.current = new AudioCtx();
      }
      if (ctxRef.current && ctxRef.current.state === 'suspended') {
        ctxRef.current.resume().catch(() => {});
      }
      return ctxRef.current;
    } catch {
      return null;
    }
  }, []);

  // Gentle, bouncy Nintendo-style pentatonic marimba + bass BGM loop
  useEffect(() => {
    if (bgmIntervalRef.current) {
      clearInterval(bgmIntervalRef.current);
      bgmIntervalRef.current = null;
    }
    if (!bgmEnabled) return;

    // 16-step bright C-major / F-major / G-major playful melody
    const melody = [
      523.25, 659.25, 783.99, 659.25,
      880.0, 783.99, 659.25, 587.33,
      523.25, 587.33, 659.25, 783.99,
      880.0, 1046.5, 783.99, 0,
    ];
    const bass = [
      261.63, 0, 196.0, 0,
      349.23, 0, 261.63, 0,
      261.63, 0, 220.0, 0,
      293.66, 0, 196.0, 0,
    ];

    const playStep = () => {
      const ctx = getCtx();
      if (!ctx) return;
      try {
        const idx = stepRef.current % melody.length;
        stepRef.current += 1;
        const now = ctx.currentTime;

        const mFreq = melody[idx];
        if (mFreq > 0) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(mFreq, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.045, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.26);
        }

        const bFreq = bass[idx];
        if (bFreq > 0) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(bFreq, now);
          gain.gain.setValueAtTime(0.032, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.36);
        }
      } catch {
        // Ignore audio errors safely
      }
    };

    playStep();
    bgmIntervalRef.current = setInterval(playStep, 285);

    return () => {
      if (bgmIntervalRef.current) {
        clearInterval(bgmIntervalRef.current);
        bgmIntervalRef.current = null;
      }
    };
  }, [bgmEnabled, getCtx]);

  const playSfx = useCallback(
    (type) => {
      if (!sfxEnabled) return;
      const ctx = getCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const tone = (freq, start, dur, wave = 'sine', gainVal = 0.12) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(gainVal, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + dur);
        };

        if (type === 'pop') {
          tone(520, now, 0.08, 'triangle', 0.13);
          tone(740, now + 0.04, 0.08, 'sine', 0.1);
        } else if (type === 'splash') {
          tone(380, now, 0.1, 'sine', 0.12);
          tone(560, now + 0.07, 0.12, 'sine', 0.12);
          tone(820, now + 0.14, 0.18, 'triangle', 0.11);
        } else if (type === 'sticker') {
          [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
            tone(f, now + i * 0.08, 0.22, 'triangle', 0.13)
          );
        } else if (type === 'firework') {
          [440, 554.37, 659.25, 880, 1108.73].forEach((f, i) =>
            tone(f, now + i * 0.07, 0.28, 'sine', 0.14)
          );
        } else if (type === 'hop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(680, now + 0.18);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'flip') {
          tone(420, now, 0.09, 'sine', 0.1);
          tone(700, now + 0.07, 0.15, 'triangle', 0.12);
        }
      } catch {
        // Ignore audio errors safely
      }
    },
    [sfxEnabled, getCtx]
  );

  return { sfxEnabled, setSfxEnabled, bgmEnabled, setBgmEnabled, playSfx };
}

/* ============================================================================
 * Bangul Evaluator (Gemini API with 2s timeout + Pre-written Safe Fallback)
 * ============================================================================ */
function evaluateLocally({ playerShortName, drinkId, reasonText, stage }) {
  const nameCall = `${playerShortName}아`;
  const text = (reasonText || '').trim();
  const drink = DRINKS.find((d) => d.id === drinkId);

  if (text.includes('물이 없') || text.includes('물 안 들') || text.includes('물이 안')) {
    return {
      valid_reason: true,
      misconception: '다른 음료에 물이 전혀 없다고 생각함',
      expression: '놀람',
      reply: `${nameCall}, 다른 음료에도 물은 있어! 하지만 설탕이 많아서 목마를 땐 물이 최고야 💧`,
    };
  }

  if (
    text.includes('선생님') ||
    text.includes('시켜서') ||
    text.includes('엄마가') ||
    text.includes('그냥요')
  ) {
    return {
      valid_reason: false,
      misconception: '없음',
      expression: '갸웃',
      reply: `${nameCall}, 그렇게 생각해 줬구나! 그런데 우리 몸에 물이 왜 필요했지? 🤔`,
    };
  }

  if (drinkId === 'milk') {
    if (
      text.includes('간식') ||
      text.includes('물 먼저') ||
      text.includes('물도') ||
      text.includes('몸에 필요')
    ) {
      return {
        valid_reason: true,
        misconception: '없음',
        expression: '웃음',
        reply: `${nameCall}, 딱 맞았어! 목마를 땐 물, 우유는 든든한 간식 친구야 🥛`,
      };
    }
    return {
      valid_reason: false,
      misconception: '없음',
      expression: '갸웃',
      reply: `${nameCall}, 우유도 멋진 간식 친구야! 목이 마를 땐 물이 먼저 필요하지 않을까? 💧`,
    };
  }

  if (
    drinkId !== 'water' &&
    (text.includes('맛있') || text.includes('달아') || text.includes('좋아해') || text.length < 4)
  ) {
    return {
      valid_reason: false,
      misconception: '없음',
      expression: '갸웃',
      reply: `${nameCall}, ${drink ? drink.name : '그 음료'} 맛있지! 그런데 목이 마를 땐 몸이 뭐가 필요할까? 💧`,
    };
  }

  if (
    drinkId !== 'water' &&
    (text.includes('물') || text.includes('몸') || text.includes('수분') || text.includes('갈증') || text.includes('땀'))
  ) {
    return {
      valid_reason: true,
      misconception: '없음',
      expression: '응원',
      reply:
        stage === 3
          ? `${nameCall}, 잘 연결했어! 집에서도 목마를 땐 물 먼저 마셔 보자! ✨`
          : `${nameCall}, 멋지게 떠올렸어! 목마를 땐 몸에 필요한 물 먼저 마시자! 🌟`,
    };
  }

  if (
    drinkId === 'water' &&
    (text.includes('땀') ||
      text.includes('채워') ||
      text.includes('몸') ||
      text.includes('필요') ||
      text.includes('갈증') ||
      text.includes('설탕') ||
      text.includes('시원') ||
      text.includes('수분') ||
      text.includes('물') ||
      text.includes('먼저') ||
      text.length >= 6)
  ) {
    return {
      valid_reason: true,
      misconception: '없음',
      expression: '웃음',
      reply:
        stage === 3
          ? `${nameCall}, 대단해! 집에서도 목마를 땐 물 먼저 고른 이유가 정말 멋져! 💧`
          : `${nameCall}, 정말 멋진 이유야! 땀으로 나간 물을 꼭 채워 줘야 해! ✨`,
    };
  }

  return {
    valid_reason: false,
    misconception: '없음',
    expression: '갸웃',
    reply: `${nameCall}, 좋은 생각이야! 목이 마를 때 우리 몸에 물이 왜 필요한지 말해 줄래? 💧`,
  };
}

async function askBangulAI({ apiKey, playerShortName, drinkId, reasonText, stage }) {
  const fallback = evaluateLocally({ playerShortName, drinkId, reasonText, stage });
  if (!apiKey || !apiKey.trim()) return fallback;

  const drink = DRINKS.find((d) => d.id === drinkId);
  const userPrompt = `학생 이름: ${playerShortName}, 스테이지: ${stage}, 선택한 음료: ${drink ? drink.name : '없음'}, 학생이 말한 이유: "${reasonText}". JSON으로만 답해줘.`;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 1900);

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(
        apiKey.trim()
      )}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: controller.signal,
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: BANGUL_SYSTEM_INSTRUCTION }] },
          contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
          generationConfig: {
            responseMimeType: 'application/json',
            temperature: 0.4,
            maxOutputTokens: 180,
          },
        }),
      }
    );
    clearTimeout(timer);
    if (!res.ok) return fallback;
    const data = await res.json();
    const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!rawText) return fallback;
    const parsed = JSON.parse(rawText);
    if (typeof parsed.reply === 'string' && parsed.reply.trim()) {
      return {
        valid_reason: Boolean(parsed.valid_reason),
        misconception: parsed.misconception || '없음',
        expression: ['웃음', '갸웃', '놀람', '응원'].includes(parsed.expression)
          ? parsed.expression
          : fallback.expression,
        reply: parsed.reply.slice(0, 80),
      };
    }
    return fallback;
  } catch {
    clearTimeout(timer);
    return fallback;
  }
}

            className={`h-full bg-gradient-to-r ${gaugeFill} transition-all duration-700 ease-out relative rounded-full`}

        <div className="grid grid-cols-3 gap-1.5">

                  {slot.label}

/* ============================================================================
 * Clean RPG Bottom Dialogue Box (Typewriter + Tap to Reveal)
 * ============================================================================ */
function RpgDialogueBox({ expression, text, waiting }) {
  const [visibleLen, setVisibleLen] = useState(0);

  useEffect(() => {
    setVisibleLen(0);
    if (!text) return;
    const stepMs = Math.max(12, Math.min(26, Math.floor(1050 / Math.max(1, text.length))));
    const id = setInterval(() => {
      setVisibleLen((prev) => {
        if (prev >= text.length) {
          clearInterval(id);
          return text.length;
        }
        return prev + 1;
      });
    }, stepMs);
    return () => clearInterval(id);
  }, [text]);

  return (
    <div
      onClick={() => text && setVisibleLen(text.length)}
      className="mt-2.5 bg-white/95 rounded-[24px] border-[3px] border-sky-300 shadow-md px-4 py-2.5 xl:px-5 xl:py-3 flex items-center gap-3.5 cursor-pointer select-none shrink-0"
      title="탭하면 전체 문장이 바로 나타납니다"
    >
      <BangulAvatar expression={expression} size={64} waiting={waiting} />
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 mb-0.5">
          <span className="px-2.5 py-0.5 rounded-full bg-sky-100 text-sky-800 text-xs xl:text-sm font-black">
            방울이
          </span>
          {waiting && (
            <span className="text-xs xl:text-sm font-extrabold text-amber-600 animate-pulse">
              음~ 뭐라고 했을까?
            </span>
          )}
        </div>
        <p className="text-[19px] xl:text-[28px] font-black text-slate-800 leading-snug">
          {text ? text.slice(0, visibleLen) : '음~ 뭐라고 했을까?'}
        </p>
      </div>
    </div>
  );
}

/* ============================================================================
 * Main App Component
 * ============================================================================ */
function App() {
  const [screen, setScreen] = useState('start');
  const [completedStages, setCompletedStages] = useState([false, false, false, false, false]);
  const [activePlayer, setActivePlayer] = useState('seeun');
  const [players, setPlayers] = useState(createInitialPlayers);
  const playersRef = useRef(players);
  useEffect(() => {
    playersRef.current = players;
  }, [players]);

  const [dialogue, setDialogue] = useState({
    expression: '웃음',
    text: '안녕! 나는 방울이야! 몸속 물 게이지를 0%에서 100%까지 함께 채워 보자! 💧',
    waiting: false,
  });

  const [celebration, setCelebration] = useState({ active: false, kind: 'confetti' });
  const [stage1IntroActive, setStage1IntroActive] = useState(false);
  const [fridgeOpen, setFridgeOpen] = useState(false);

  const [tankLevel, setTankLevel] = useState(0);
  const [tankEntries, setTankEntries] = useState([]);
  const [stage2Timer, setStage2Timer] = useState(30);
  const [stage2TimerRunning, setStage2TimerRunning] = useState(false);
  const [stage2Input, setStage2Input] = useState('');
  const [stage2AskLearned, setStage2AskLearned] = useState(false);

  const [reasonDraft, setReasonDraft] = useState('');
  const [isListening, setIsListening] = useState(false);
  const [micNotice, setMicNotice] = useState('');
  const [blankFieldAlert, setBlankFieldAlert] = useState('');
  const [stage4Step, setStage4Step] = useState(1);
  const [stage5Tab, setStage5Tab] = useState('quiz');
  const [stage5QuizIdx, setStage5QuizIdx] = useState(0);
  const [stage5Hint, setStage5Hint] = useState('');

  const [lessonSeconds, setLessonSeconds] = useState(600);
  const [lessonTimerRunning, setLessonTimerRunning] = useState(false);
  const [showTeacherModal, setShowTeacherModal] = useState(false);
  const [showApiModal, setShowApiModal] = useState(false);
  const [geminiApiKey, setGeminiApiKey] = useState('');
  const [apiKeyDraft, setApiKeyDraft] = useState('');

  const audio = useGameAudio();
  const recognitionRef = useRef(null);

  useEffect(() => {
    try {
      const saved = localStorage.getItem('bangul_gemini_key');
      if (saved) {
        setGeminiApiKey(saved);
        setApiKeyDraft(saved);
      }
    } catch {
      // ignore
    }
  }, []);

  useEffect(() => {
    if (!lessonTimerRunning) return;
    const id = setInterval(() => {
      setLessonSeconds((s) => (s > 0 ? s - 1 : 0));
    }, 1000);
    return () => clearInterval(id);
  }, [lessonTimerRunning]);

  useEffect(() => {
    if (!stage2TimerRunning || screen !== 'stage2') return;
    const id = setInterval(() => {
      setStage2Timer((t) => {
        if (t <= 1) {
          setStage2TimerRunning(false);
          return 0;
        }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [stage2TimerRunning, screen]);

  const triggerCelebration = useCallback(
    (kind = 'confetti') => {
      setCelebration({ active: true, kind });
      audio.playSfx(kind === 'fireworks' ? 'firework' : 'sticker');
      setTimeout(() => {
        setCelebration((prev) => (prev.active ? { ...prev, active: false } : prev));
      }, 1400);
    },
    [audio]
  );

  // Helper to show +delta animation briefly on a player's water gauge
  const clearDeltaLater = useCallback((pid) => {
    setTimeout(() => {
      setPlayers((prev) => ({
        ...prev,
        [pid]: { ...prev[pid], gaugeDelta: 0 },
      }));
    }, 1200);
  }, []);

  const addWaterGauge = useCallback(
    (pid, amount) => {
      if (amount <= 0) return;
      setPlayers((prev) => {
        const cur = prev[pid];
        const nextVal = Math.min(100, cur.waterGauge + amount);
        const actualDelta = nextVal - cur.waterGauge;
        return {
          ...prev,
          [pid]: {
            ...cur,
            waterGauge: nextVal,
            gaugeDelta: actualDelta,
          },
        };
      });
      clearDeltaLater(pid);
    },
    [clearDeltaLater]
  );

  const enterStage = useCallback(
    (stageNum) => {
      audio.playSfx('hop');
      setReasonDraft('');
      setBlankFieldAlert('');
      setMicNotice('');
      setActivePlayer('seeun');
      setScreen(`stage${stageNum}`);

      if (stageNum === 1) {
        setStage1IntroActive(true);
        setDialogue({
          expression: '놀람',
          text: '운동장에서 신나게 뛰었더니 땀이 뚝뚝! 0%인 물 게이지를 채워 보자! 💦',
          waiting: false,
        });
        setTimeout(() => setStage1IntroActive(false), 1400);
      } else if (stageNum === 2) {
        setStage2Timer(30);
        setStage2TimerRunning(false);
        setDialogue({
          expression: '응원',
          text: '둘이 힘을 합쳐 물탱크를 채우면 우리 물 게이지도 쑥쑥 올라가! 💧',
          waiting: true,
        });
      } else if (stageNum === 3) {
        setFridgeOpen(false);
        setTimeout(() => setFridgeOpen(true), 220);
        setDialogue({
          expression: '놀람',
          text: 'TV 보다 목이 말라 냉장고를 열었어! 무엇을 먼저 마실까? 🧊',
          waiting: true,
        });
      } else if (stageNum === 4) {
        setStage4Step(1);
        setDialogue({
          expression: '웃음',
          text: '1단계! 먼저 물 마시기 어려운 상황 카드를 하나 골라 보자! 🗺️',
          waiting: true,
        });
      } else if (stageNum === 5) {
        setStage5Tab('quiz');
        setStage5QuizIdx(0);
        setStage5Hint('');
        setDialogue({
          expression: '응원',
          text: '오늘 배운 내용을 복습 퀴즈로 맞히고 방울이 화분에 꽃을 피워 보자! 🌱',
          waiting: true,
        });
      }
    },
    [audio]
  );

  const markStageDone = useCallback((stageIdx) => {
    setCompletedStages((prev) => prev.map((v, i) => (i === stageIdx ? true : v)));
  }, []);

  const currentStageNum = screen.startsWith('stage') ? Number(screen.replace('stage', '')) : 0;

  const resetCurrentStage = useCallback(() => {
    if (!currentStageNum) return;
    audio.playSfx('pop');
    setReasonDraft('');
    setBlankFieldAlert('');
    const fresh = createInitialPlayers();
    if (currentStageNum === 1) {
      setPlayers((prev) => ({
        seeun: {
          ...prev.seeun,
          waterGauge: 0,
          gaugeDelta: 0,
          stickers: [false, prev.seeun.stickers[1], prev.seeun.stickers[2]],
          stage1: fresh.seeun.stage1,
        },
        sehyun: {
          ...prev.sehyun,
          waterGauge: 0,
          gaugeDelta: 0,
          stickers: [false, prev.sehyun.stickers[1], prev.sehyun.stickers[2]],
          stage1: fresh.sehyun.stage1,
        },
      }));
    } else if (currentStageNum === 2) {
      setTankLevel(0);
      setTankEntries([]);
      setStage2Timer(30);
      setStage2TimerRunning(false);
      setStage2AskLearned(false);
      setPlayers((prev) => ({
        seeun: { ...prev.seeun, stage2: { reasons: [], learned: '' } },
        sehyun: { ...prev.sehyun, stage2: { reasons: [], learned: '' } },
      }));
    } else if (currentStageNum === 3) {
      setPlayers((prev) => ({
        seeun: {
          ...prev.seeun,
          stickers: [prev.seeun.stickers[0], false, prev.seeun.stickers[2]],
          stage3: fresh.seeun.stage3,
        },
        sehyun: {
          ...prev.sehyun,
          stickers: [prev.sehyun.stickers[0], false, prev.sehyun.stickers[2]],
          stage3: fresh.sehyun.stage3,
        },
      }));
    } else if (currentStageNum === 4) {
      setPlayers((prev) => ({
        seeun: {
          ...prev.seeun,
          stickers: [prev.seeun.stickers[0], prev.seeun.stickers[1], false],
          stage4: fresh.seeun.stage4,
        },
        sehyun: {
          ...prev.sehyun,
          stickers: [prev.sehyun.stickers[0], prev.sehyun.stickers[1], false],
          stage4: fresh.sehyun.stage4,
        },
      }));
    } else if (currentStageNum === 5) {
      setStage5Tab('quiz');
      setStage5QuizIdx(0);
      setStage5Hint('');
      setPlayers((prev) => ({
        seeun: { ...prev.seeun, stage5: fresh.seeun.stage5 },
        sehyun: { ...prev.sehyun, stage5: fresh.sehyun.stage5 },
      }));
    }
    enterStage(currentStageNum);
  }, [audio, currentStageNum, enterStage]);

  const resetWholeGame = useCallback(() => {
    audio.playSfx('pop');
    setPlayers(createInitialPlayers());
    setCompletedStages([false, false, false, false, false]);
    setActivePlayer('seeun');
    setTankLevel(0);
    setTankEntries([]);
    setStage2Timer(30);
    setStage2TimerRunning(false);
    setStage2AskLearned(false);
    setStage4Step(1);
    setStage5Tab('quiz');
    setStage5QuizIdx(0);
    setStage5Hint('');
    setLessonSeconds(600);
    setLessonTimerRunning(false);
    setScreen('start');
    setDialogue({
      expression: '웃음',
      text: '처음부터 다시 시작해 볼까? 물 게이지를 0%에서 100%까지 채워 보자! 💧',
      waiting: false,
    });
  }, [audio]);

  const toggleMic = useCallback(() => {
    if (isListening && recognitionRef.current) {
      try {
        recognitionRef.current.stop();
      } catch {
        // ignore
      }
      setIsListening(false);
      return;
    }
    const SpeechRec =
      typeof window !== 'undefined' &&
      (window.SpeechRecognition || window.webkitSpeechRecognition);
    if (!SpeechRec) {
      setMicNotice('이 브라우저에서는 마이크를 지원하지 않아 버튼이나 키보드로 입력해 주세요.');
      return;
    }
    try {
      const rec = new SpeechRec();
      rec.lang = 'ko-KR';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onresult = (e) => {
        const transcript = e.results?.[0]?.[0]?.transcript || '';
        if (transcript) setReasonDraft(transcript);
        setIsListening(false);
      };
      rec.onerror = () => {
        setIsListening(false);
        setMicNotice('마이크 입력이 중단되었어요. 빠른 버튼으로 입력해 주세요.');
      };
      rec.onend = () => setIsListening(false);
      recognitionRef.current = rec;
      setMicNotice('');
      setIsListening(true);
      rec.start();
    } catch {
      setIsListening(false);
      setMicNotice('마이크를 켤 수 없어요. 빠른 버튼으로 바로 입력할 수 있어요.');
    }
  }, [isListening]);

  /* --------------------------------------------------------------------------
   * Drink Selection Handler (Stages 1, 3, 5)
   * -------------------------------------------------------------------------- */
  const handleSelectDrink = useCallback(
    (drinkId, targetPlayerId = activePlayer) => {
      const p = playersRef.current[targetPlayerId];
      const drink = DRINKS.find((d) => d.id === drinkId);
      if (!p || !drink) return;

      if (screen === 'stage1') {
        const isWater = drinkId === 'water';
        audio.playSfx(isWater ? 'splash' : 'pop');
        const msg = isWater
          ? `${p.shortName}아, 시원한 물을 골랐구나! 왜 물을 골랐는지 알려 줄래? 💧`
          : `${p.shortName}아, ${drink.name}를 골랐구나! 왜 골랐어? 궁금해! 🤔`;
        const boost = isWater && !p.stage1.waterBoosted ? 15 : 0;
        setPlayers((prev) => {
          const cur = prev[targetPlayerId];
          return {
            ...prev,
            [targetPlayerId]: {
              ...cur,
              waterGauge: Math.min(100, cur.waterGauge + boost),
              gaugeDelta: boost,
              bangul: { expression: isWater ? '웃음' : '갸웃', reply: msg, valid_reason: false, misconception: '없음' },
              stage1: { ...cur.stage1, drink: drinkId, waterBoosted: cur.stage1.waterBoosted || isWater },
            },
          };
        });
        if (boost > 0) clearDeltaLater(targetPlayerId);
        setDialogue({ expression: isWater ? '웃음' : '갸웃', text: msg, waiting: true });
      } else if (screen === 'stage3') {
        const isWater = drinkId === 'water';
        const isMilk = drinkId === 'milk';
        audio.playSfx(isWater ? 'splash' : 'pop');
        const msg = isWater
          ? `${p.shortName}아, 집에서도 물을 먼저 골랐네! 왜 골랐는지 말해 줄래? 💧`
          : isMilk
          ? `${p.shortName}아, 우유는 든든한 간식 친구야! 목이 마를 땐 왜 골랐어? 🥛`
          : `${p.shortName}아, 냉장고에서 ${drink.name}가 눈에 띄었구나! 왜 골랐어? 🧊`;
        const boost = isWater && !p.stage3.waterBoosted ? 10 : 0;
        setPlayers((prev) => {
          const cur = prev[targetPlayerId];
          return {
            ...prev,
            [targetPlayerId]: {
              ...cur,
              waterGauge: Math.min(100, cur.waterGauge + boost),
              gaugeDelta: boost,
              bangul: { expression: isWater ? '웃음' : '갸웃', reply: msg, valid_reason: false, misconception: '없음' },
              stage3: { ...cur.stage3, drink: drinkId, waterBoosted: cur.stage3.waterBoosted || isWater },
            },
          };
        });
        if (boost > 0) clearDeltaLater(targetPlayerId);
        setDialogue({ expression: isWater ? '웃음' : '갸웃', text: msg, waiting: true });
      } else if (screen === 'stage5' && stage5Tab === 'bonus') {
        audio.playSfx('pop');
        const msg = `${p.shortName}아, ${drink.name}를 골랐구나! 이유도 한 가지 말해 줄래? 🌱`;
        setPlayers((prev) => ({
          ...prev,
          [targetPlayerId]: {
            ...prev[targetPlayerId],
            bangul: { expression: '웃음', reply: msg, valid_reason: false, misconception: '없음' },
            stage5: { ...prev[targetPlayerId].stage5, drink: drinkId },
          },
        }));
        setDialogue({ expression: '웃음', text: msg, waiting: true });
      }
    },
    [activePlayer, audio, clearDeltaLater, screen, stage5Tab]
  );

  /* --------------------------------------------------------------------------
   * Reason Submission Handler (Stages 1, 3, 5) -> Progressive 0% -> 100% Gauge
   * -------------------------------------------------------------------------- */
  const handleSubmitReason = useCallback(
    async (textOverride, targetPlayerId = activePlayer, drinkOverride = null) => {
      const text = (textOverride !== undefined ? textOverride : reasonDraft).trim();
      if (!text) return;
      const latest = playersRef.current;
      const p = latest[targetPlayerId];
      const stageKey = screen === 'stage1' ? 'stage1' : screen === 'stage3' ? 'stage3' : 'stage5';
      const drinkId = drinkOverride || p[stageKey].drink;
      if (!drinkId) {
        setDialogue({
          expression: '갸웃',
          text: `${p.shortName}아, 먼저 위에서 음료 카드를 하나 골라 줄래? 💧`,
          waiting: true,
        });
        return;
      }

      const stageNum = screen === 'stage1' ? 1 : screen === 'stage3' ? 3 : 5;
      const aiRes =
        stageNum === 5
          ? {
              ...evaluateLocally({ playerShortName: p.shortName, drinkId, reasonText: text, stage: 5 }),
              reply: `${p.shortName}아, 스스로 생각해서 잘 말해 줬어! 물 게이지가 100% 가득 찼어! 🌱`,
            }
          : await askBangulAI({
              apiKey: geminiApiKey,
              playerShortName: p.shortName,
              drinkId,
              reasonText: text,
              stage: stageNum,
            });

      setReasonDraft('');

      const awardSticker = stageNum === 1 || stageNum === 3 ? aiRes.valid_reason : false;
      const stickerIdx = stageNum === 1 ? 0 : 1;

      let addedGauge = 0;
      setPlayers((prev) => {
        const cur = prev[targetPlayerId];
        const nextStickers = [...cur.stickers];
        if (awardSticker) nextStickers[stickerIdx] = true;

        let targetGauge = cur.waterGauge;
        if (stageNum === 1 && aiRes.valid_reason && !cur.stage1.completed) {
          targetGauge = Math.max(cur.waterGauge + 15, 30);
        } else if (stageNum === 3 && aiRes.valid_reason && !cur.stage3.completed) {
          targetGauge = Math.min(100, Math.max(cur.waterGauge + 10, 70));
        } else if (stageNum === 5 && !cur.stage5.completed) {
          targetGauge = 100;
        }
        addedGauge = Math.max(0, targetGauge - cur.waterGauge);

        return {
          ...prev,
          [targetPlayerId]: {
            ...cur,
            waterGauge: targetGauge,
            gaugeDelta: addedGauge,
            stickers: nextStickers,
            bangul: aiRes,
            [stageKey]: {
              ...cur[stageKey],
              reason: text,
              history: [...(cur[stageKey].history || []), text],
              followUpNeeded: stageNum === 5 ? false : !aiRes.valid_reason,
              validReason: aiRes.valid_reason || cur[stageKey].validReason,
              misconception:
                aiRes.misconception && aiRes.misconception !== '없음'
                  ? aiRes.misconception
                  : cur[stageKey].misconception,
              completed: stageNum === 5 ? true : aiRes.valid_reason,
            },
          },
        };
      });

      if (addedGauge > 0) clearDeltaLater(targetPlayerId);
      setDialogue({ expression: aiRes.expression, text: aiRes.reply, waiting: !aiRes.valid_reason });

      if (awardSticker || stageNum === 5) {
        triggerCelebration('confetti');
      } else {
        audio.playSfx('pop');
      }

      const otherId = targetPlayerId === 'seeun' ? 'sehyun' : 'seeun';
      const thisDone = stageNum === 5 ? true : aiRes.valid_reason;
      const otherDone = playersRef.current[otherId][stageKey].completed;
      if (thisDone && !otherDone) {
        setTimeout(() => setActivePlayer(otherId), 420);
      }
      if (thisDone && otherDone && stageNum !== 5) {
        markStageDone(stageNum - 1);
      }
    },
    [activePlayer, audio, clearDeltaLater, geminiApiKey, markStageDone, reasonDraft, screen, triggerCelebration]
  );

  /* --------------------------------------------------------------------------
   * Stage 2: Shared Water Tank Entry (+10% to active player's gauge too!)
   * -------------------------------------------------------------------------- */
  const handleAddTankReason = useCallback(
    (textOverride, targetPlayerId = activePlayer) => {
      const text = (textOverride !== undefined ? textOverride : stage2Input).trim();
      if (!text) return;
      const p = playersRef.current[targetPlayerId];
      audio.playSfx('splash');

      const nextLevel = Math.min(100, tankLevel + 25);
      setTankLevel(nextLevel);
      setTankEntries((prev) => [
        ...prev,
        { id: Date.now() + Math.random(), playerId: targetPlayerId, name: p.shortName, text },
      ]);
      setStage2Input('');

      addWaterGauge(targetPlayerId, 10);
      setPlayers((prev) => ({
        ...prev,
        [targetPlayerId]: {
          ...prev[targetPlayerId],
          stage2: {
            ...prev[targetPlayerId].stage2,
            reasons: [...prev[targetPlayerId].stage2.reasons, text],
          },
          bangul: {
            expression: '응원',
            reply: `${p.shortName}아, 물탱크도 내 물 게이지도 쑥쑥 차오르고 있어! 💧`,
            valid_reason: true,
            misconception: '없음',
          },
        },
      }));

      if (nextLevel >= 100) {
        setStage2TimerRunning(false);
        setStage2AskLearned(true);
        markStageDone(1);
        triggerCelebration('fireworks');
        setDialogue({
          expression: '웃음',
          text: '우와! 둘이 함께 물탱크를 가득 채웠어! 친구 이야기에서 새로 알게 된 점은? 🎉',
          waiting: true,
        });
      } else {
        const nextPlayer = targetPlayerId === 'seeun' ? 'sehyun' : 'seeun';
        setActivePlayer(nextPlayer);
        setDialogue({
          expression: '응원',
          text: `좋아! 물탱크가 ${nextLevel}% 찼어! 이제 ${playersRef.current[nextPlayer].shortName}이 차례야! 💧`,
          waiting: true,
        });
      }
    },
    [activePlayer, addWaterGauge, audio, markStageDone, stage2Input, tankLevel, triggerCelebration]
  );

  /* --------------------------------------------------------------------------
   * Stage 4: Complete Strategy Card (+15% water gauge -> ~85%)
   * -------------------------------------------------------------------------- */
  const handleCompleteStrategy = useCallback(
    (targetPlayerId = activePlayer) => {
      const p = playersRef.current[targetPlayerId];
      const s4 = p.stage4;

      if (!s4.situationId) {
        setBlankFieldAlert('먼저 물 마시기 어려운 상황 카드를 하나 골라 주세요!');
        return;
      }
      if (!s4.solution) {
        setBlankFieldAlert('추천 해결 카드를 하나 골라 주세요!');
        return;
      }
      if (!s4.when.trim()) {
        setBlankFieldAlert(`"${p.shortName}아, [언제] 마실지 한 번 더 물어봐 주세요!"`);
        setDialogue({ expression: '갸웃', text: `${p.shortName}아, 언제 물을 마시면 좋을까? ⏰`, waiting: true });
        return;
      }
      if (!s4.where.trim()) {
        setBlankFieldAlert(`"${p.shortName}아, [어디서] 마실지 한 번 더 물어봐 주세요!"`);
        setDialogue({ expression: '갸웃', text: `${p.shortName}아, 어디서 물을 마실까? 정수기·수돗물·물병 다 OK야! 💧`, waiting: true });
        return;
      }
      if (!s4.how.trim()) {
        setBlankFieldAlert(`"${p.shortName}아, [어떻게] 마실지 한 번 더 물어봐 주세요!"`);
        setDialogue({ expression: '갸웃', text: `${p.shortName}아, 어떻게 실천해 볼까? 🌟`, waiting: true });
        return;
      }

      const sit = DIFFICULT_SITUATIONS.find((s) => s.id === s4.situationId);
      const finalName = s4.strategyName.trim() || sit?.recommendedNames[0] || '나만의 물 마시기 작전';

      setBlankFieldAlert('');
      audio.playSfx('flip');
      triggerCelebration('confetti');

      setPlayers((prev) => {
        const cur = prev[targetPlayerId];
        const nextStickers = [...cur.stickers];
        nextStickers[2] = true;
        const nextGauge = cur.stage4.completed ? cur.waterGauge : Math.min(90, Math.max(cur.waterGauge + 15, 85));
        return {
          ...prev,
          [targetPlayerId]: {
            ...cur,
            waterGauge: nextGauge,
            gaugeDelta: Math.max(0, nextGauge - cur.waterGauge),
            stickers: nextStickers,
            bangul: {
              expression: '응원',
              reply: `${cur.shortName}아, "${finalName}" 카드 완성! 정말 멋져! ✨`,
              valid_reason: true,
              misconception: '없음',
            },
            stage4: { ...cur.stage4, strategyName: finalName, cardFlipped: true, completed: true },
          },
        };
      });
      clearDeltaLater(targetPlayerId);

      setDialogue({
        expression: '응원',
        text: `반짝반짝! ${p.shortName}이의 "${finalName}" 수집 카드가 완성됐어! ✨`,
        waiting: false,
      });

      const otherId = targetPlayerId === 'seeun' ? 'sehyun' : 'seeun';
      if (!playersRef.current[otherId].stage4.completed) {
        setTimeout(() => setActivePlayer(otherId), 650);
      } else {
        markStageDone(3);
      }
    },
    [activePlayer, audio, clearDeltaLater, markStageDone, triggerCelebration]
  );

  /* --------------------------------------------------------------------------
   * Stage 5: In-Class Review Quiz -> Grows Bangul's Potted Plant + 100% Gauge
   * -------------------------------------------------------------------------- */
  const handleAnswerReviewQuiz = useCallback(
    (quizItem, option, targetPlayerId = activePlayer) => {
      const p = playersRef.current[targetPlayerId];
      if (!p || !quizItem || !option) return;

      if (!option.isCorrect) {
        audio.playSfx('pop');
        setStage5Hint(`🌱 새싹이 힌트: "${option.feedback}"`);
        setDialogue({
          expression: '갸웃',
          text: `${p.shortName}아, ${option.feedback}`,
          waiting: true,
        });
        return;
      }

      setStage5Hint('');
      audio.playSfx('splash');

      setPlayers((prev) => {
        const cur = prev[targetPlayerId];
        const already = cur.stage5.solvedQuizzes.includes(quizItem.id);
        const nextSolved = already ? cur.stage5.solvedQuizzes : [...cur.stage5.solvedQuizzes, quizItem.id];
        const nextPlant = Math.min(3, nextSolved.length);
        const isAllDone = nextSolved.length >= REVIEW_QUIZ_ITEMS.length;
        const boost = already ? 0 : isAllDone ? Math.max(5, 100 - cur.waterGauge) : 5;
        const nextGauge = Math.min(100, cur.waterGauge + boost);

        return {
          ...prev,
          [targetPlayerId]: {
            ...cur,
            waterGauge: nextGauge,
            gaugeDelta: boost,
            bangul: {
              expression: '응원',
              reply: `${cur.shortName}아, ${option.feedback}`,
              valid_reason: true,
              misconception: '없음',
            },
            stage5: {
              ...cur.stage5,
              validReason: true,
              reason: `복습 퀴즈 ${nextSolved.length}/3 완료`,
              solvedQuizzes: nextSolved,
              plantStage: nextPlant,
              completed: isAllDone,
            },
          },
        };
      });
      clearDeltaLater(targetPlayerId);

      setDialogue({
        expression: '웃음',
        text: `${p.shortName}아, ${option.feedback}`,
        waiting: false,
      });

      const otherId = targetPlayerId === 'seeun' ? 'sehyun' : 'seeun';
      const otherSolvedThis = playersRef.current[otherId].stage5.solvedQuizzes.includes(quizItem.id);
      if (!otherSolvedThis) {
        setTimeout(() => setActivePlayer(otherId), 380);
      } else {
        triggerCelebration('confetti');
        if (stage5QuizIdx < REVIEW_QUIZ_ITEMS.length - 1) {
          setTimeout(() => {
            setStage5QuizIdx((i) => Math.min(REVIEW_QUIZ_ITEMS.length - 1, i + 1));
            setActivePlayer('seeun');
          }, 900);
        }
      }
    },
    [activePlayer, audio, clearDeltaLater, stage5QuizIdx, triggerCelebration]
  );

  /* --------------------------------------------------------------------------
   * Demo Auto-Fill ("이 단계 자동 채우기")
   * -------------------------------------------------------------------------- */
  const handleDemoAutoFill = useCallback(() => {
    if (screen === 'start') {
      setLessonTimerRunning(true);
      audio.playSfx('hop');
      setScreen('map');
      return;
    }
    if (screen === 'map') {
      const nextIdx = completedStages.findIndex((c) => !c);
      enterStage(nextIdx === -1 ? 5 : nextIdx + 1);
      return;
    }
    if (screen === 'ending') {
      resetWholeGame();
      return;
    }

    const latest = playersRef.current;

    if (screen === 'stage1') {
      if (!latest.seeun.stage1.drink) {
        setActivePlayer('seeun');
        handleSelectDrink('water', 'seeun');
        setTimeout(() => handleSubmitReason('선생님이 시켜서요', 'seeun', 'water'), 160);
      } else if (!latest.seeun.stage1.completed) {
        setActivePlayer('seeun');
        handleSubmitReason('땀으로 나간 물을 채워 줘요', 'seeun', 'water');
      } else if (!latest.sehyun.stage1.drink) {
        setActivePlayer('sehyun');
        handleSelectDrink('juice', 'sehyun');
        setTimeout(() => handleSubmitReason('맛있어서요', 'sehyun', 'juice'), 160);
      } else if (!latest.sehyun.stage1.completed) {
        setActivePlayer('sehyun');
        handleSubmitReason('물도 몸에 필요하구나', 'sehyun', 'juice');
      } else {
        markStageDone(0);
        setScreen('map');
      }
      return;
    }

    if (screen === 'stage2') {
      if (tankLevel < 25) handleAddTankReason('땀 흘린 뒤 물을 마시면 몸이 시원해져요', 'seeun');
      else if (tankLevel < 50) handleAddTankReason('물은 설탕이 없어서 목이 안 답답해요', 'sehyun');
      else if (tankLevel < 75) handleAddTankReason('몸속에 물이 많아야 힘이 나요', 'seeun');
      else if (tankLevel < 100) handleAddTankReason('물 마시면 머리가 맑아져요', 'sehyun');
      else if (!latest.seeun.stage2.learned) {
        setPlayers((prev) => ({
          ...prev,
          seeun: { ...prev.seeun, stage2: { ...prev.seeun.stage2, learned: '설탕 없는 물이 갈증에 좋다는 걸 알았어요' } },
          sehyun: { ...prev.sehyun, stage2: { ...prev.sehyun.stage2, learned: '친구 말 들으니 물이 힘도 나게 해 줘요' } },
        }));
        setDialogue({ expression: '웃음', text: '서로 이야기를 잘 들었구나! 둘이 함께하니 더 멋진 걸 알게 됐어! 🌟', waiting: false });
      } else {
        markStageDone(1);
        setScreen('map');
      }
      return;
    }

    if (screen === 'stage3') {
      if (!latest.seeun.stage3.completed) {
        setActivePlayer('seeun');
        handleSelectDrink('water', 'seeun');
        setTimeout(() => handleSubmitReason('집에서도 목마를 땐 물 먼저 마셔요', 'seeun', 'water'), 160);
      } else if (!latest.sehyun.stage3.drink) {
        setActivePlayer('sehyun');
        handleSelectDrink('milk', 'sehyun');
        setTimeout(() => handleSubmitReason('맛있어서요', 'sehyun', 'milk'), 160);
      } else if (!latest.sehyun.stage3.completed) {
        setActivePlayer('sehyun');
        handleSubmitReason('목마를 땐 물, 우유는 간식 친구예요', 'sehyun', 'milk');
      } else {
        markStageDone(2);
        setScreen('map');
      }
      return;
    }

    if (screen === 'stage4') {
      if (!latest.seeun.stage4.completed) {
        const sit = DIFFICULT_SITUATIONS.find((s) => s.id === 'home_tv');
        setActivePlayer('seeun');
        setPlayers((prev) => ({
          ...prev,
          seeun: {
            ...prev.seeun,
            waterGauge: 85,
            gaugeDelta: Math.max(0, 85 - prev.seeun.waterGauge),
            stickers: [prev.seeun.stickers[0], prev.seeun.stickers[1], true],
            bangul: { expression: '응원', reply: '세은아, "TV 탐정 물컵 작전" 카드 완성! ✨', valid_reason: true, misconception: '없음' },
            stage4: {
              situationId: sit.id,
              solution: sit.solutions[0],
              when: sit.defaults.when,
              where: sit.defaults.where,
              how: sit.defaults.how,
              strategyName: 'TV 탐정 물컵 작전',
              cardFlipped: true,
              completed: true,
            },
          },
        }));
        clearDeltaLater('seeun');
        audio.playSfx('flip');
        triggerCelebration('confetti');
        setDialogue({ expression: '응원', text: '세은이의 "TV 탐정 물컵 작전" 카드가 완성됐어! ✨', waiting: false });
        setTimeout(() => setActivePlayer('sehyun'), 480);
      } else if (!latest.sehyun.stage4.completed) {
        const sit = DIFFICULT_SITUATIONS.find((s) => s.id === 'home_juice');
        setActivePlayer('sehyun');
        setPlayers((prev) => ({
          ...prev,
          sehyun: {
            ...prev.sehyun,
            waterGauge: 85,
            gaugeDelta: Math.max(0, 85 - prev.sehyun.waterGauge),
            stickers: [prev.sehyun.stickers[0], prev.sehyun.stickers[1], true],
            bangul: { expression: '응원', reply: '세현아, "냉장고 물 먼저 작전" 카드 완성! ✨', valid_reason: true, misconception: '없음' },
            stage4: {
              situationId: sit.id,
              solution: sit.solutions[0],
              when: sit.defaults.when,
              where: sit.defaults.where,
              how: sit.defaults.how,
              strategyName: '냉장고 물 먼저 작전',
              cardFlipped: true,
              completed: true,
            },
          },
        }));
        clearDeltaLater('sehyun');
        markStageDone(3);
        audio.playSfx('flip');
        triggerCelebration('confetti');
        setDialogue({ expression: '응원', text: '세현이의 "냉장고 물 먼저 작전" 카드도 완성! 이제 마지막 단계로 가자! 🌟', waiting: false });
      } else {
        setScreen('map');
      }
      return;
    }

    if (screen === 'stage5') {
      if (stage5Tab === 'quiz') {
        const q = REVIEW_QUIZ_ITEMS[stage5QuizIdx];
        const sDone = latest.seeun.stage5.solvedQuizzes.includes(q.id);
        const hDone = latest.sehyun.stage5.solvedQuizzes.includes(q.id);
        const correctOpt = q.options.find((o) => o.isCorrect);
        if (!sDone) {
          setActivePlayer('seeun');
          handleAnswerReviewQuiz(q, correctOpt, 'seeun');
        } else if (!hDone) {
          setActivePlayer('sehyun');
          handleAnswerReviewQuiz(q, correctOpt, 'sehyun');
        } else if (stage5QuizIdx < REVIEW_QUIZ_ITEMS.length - 1) {
          setStage5QuizIdx((i) => i + 1);
          setStage5Hint('');
          setActivePlayer('seeun');
        } else {
          setStage5Tab('family');
          setDialogue({
            expression: '응원',
            text: '둘 다 화분에 꽃을 활짝 피웠어! 집에 가져갈 가족 안내 카드도 확인해 보자! 💌',
            waiting: false,
          });
        }
      } else if (stage5Tab === 'family') {
        markStageDone(4);
        setScreen('ending');
        triggerCelebration('fireworks');
        setDialogue({
          expression: '응원',
          text: '둘 다 물 게이지 100% 달성! 멋진 물 마시기 대원이 되었어! 🎉',
          waiting: false,
        });
      }
    }
  }, [
    audio,
    clearDeltaLater,
    completedStages,
    enterStage,
    handleAddTankReason,
    handleAnswerReviewQuiz,
    handleSelectDrink,
    handleSubmitReason,
    markStageDone,
    resetWholeGame,
    screen,
    stage5QuizIdx,
    stage5Tab,
    tankLevel,
    triggerCelebration,
  ]);

  /* --------------------------------------------------------------------------
   * Keyboard Shortcuts: 1~5 Drinks, Tab Switch Player, Enter/Space Next Step
   * -------------------------------------------------------------------------- */
  useEffect(() => {
    const onKeyDown = (e) => {
      if (showTeacherModal || showApiModal) return;
      const tag = document.activeElement?.tagName;
      const isTyping = tag === 'INPUT' || tag === 'TEXTAREA';

      if (e.key === 'Tab') {
        e.preventDefault();
        audio.playSfx('pop');
        setActivePlayer((p) => (p === 'seeun' ? 'sehyun' : 'seeun'));
        return;
      }
      if (isTyping) return;

      if (['1', '2', '3', '4', '5'].includes(e.key)) {
        const idx = Number(e.key) - 1;
        if (screen === 'stage1' || screen === 'stage3' || (screen === 'stage5' && stage5Tab === 'bonus')) {
          e.preventDefault();
          handleSelectDrink(DRINKS[idx].id, activePlayer);
        }
        return;
      }

      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        const latest = playersRef.current;
        if (screen === 'start') {
          setLessonTimerRunning(true);
          audio.playSfx('hop');
          setScreen('map');
        } else if (screen === 'map') {
          const nextIdx = completedStages.findIndex((c) => !c);
          enterStage(nextIdx === -1 ? 5 : nextIdx + 1);
        } else if (screen === 'stage1' && latest.seeun.stage1.completed && latest.sehyun.stage1.completed) {
          markStageDone(0);
          setScreen('map');
        } else if (screen === 'stage2' && tankLevel >= 100) {
          markStageDone(1);
          setScreen('map');
        } else if (screen === 'stage3' && latest.seeun.stage3.completed && latest.sehyun.stage3.completed) {
          markStageDone(2);
          setScreen('map');
        } else if (screen === 'stage4' && latest.seeun.stage4.completed && latest.sehyun.stage4.completed) {
          markStageDone(3);
          setScreen('map');
        } else if (screen === 'stage5') {
          if (stage5Tab === 'quiz' && latest.seeun.stage5.completed && latest.sehyun.stage5.completed) {
            setStage5Tab('family');
          } else if (stage5Tab === 'family') {
            markStageDone(4);
            setScreen('ending');
            triggerCelebration('fireworks');
          }
        }
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [
    activePlayer,
    audio,
    completedStages,
    enterStage,
    handleSelectDrink,
    markStageDone,
    screen,
    showApiModal,
    showTeacherModal,
    stage5QuizIdx,
    stage5Tab,
    tankLevel,
    triggerCelebration,
  ]);

  const formatClock = (sec) => {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  };

  const goPrevStage = () => {
    audio.playSfx('pop');
    if (screen === 'map') setScreen('start');
    else if (screen === 'ending') enterStage(5);
    else if (currentStageNum > 1) enterStage(currentStageNum - 1);
    else setScreen('map');
  };

  const goNextStage = () => {
    audio.playSfx('pop');
    if (screen === 'start') setScreen('map');
    else if (screen === 'map') enterStage(1);
    else if (currentStageNum >= 1 && currentStageNum < 5) enterStage(currentStageNum + 1);
    else if (currentStageNum === 5) {
      markStageDone(4);
      setScreen('ending');
      triggerCelebration('fireworks');
    }
  };

  const curPlayer = players[activePlayer];

  /* ==========================================================================
   * Render Center Stage Content (Clean, Uncluttered Visual Hierarchy)
   * ========================================================================== */
  const renderCenterStage = () => {
    /* -------------------- START SCREEN -------------------- */
    if (screen === 'start') {
      return (
        <div className="flex-1 min-h-0 bg-white/90 rounded-[28px] border-[3px] border-sky-200 shadow-lg flex flex-col items-center justify-center text-center px-6 py-4">
          <span className="px-4 py-1 rounded-full bg-amber-100 text-amber-800 font-black text-sm xl:text-base mb-3">
            초등학교 3학년 영양교육 모험 게임
          </span>

          <h1 className="text-[36px] xl:text-[54px] font-black text-slate-900 leading-tight tracking-tight mb-2">
            방울이의 <span className="text-sky-600">물 마시기</span> 대모험
          </h1>
          <p className="text-[18px] xl:text-[26px] font-bold text-slate-500 mb-5">
            목이 마를 땐 무엇을 마실까? 0%에서 100%까지 물 게이지를 채워요!
          </p>

          <div className="my-2">
            <BangulAvatar expression="웃음" size={136} />
          </div>

          <button
            onClick={() => {
              setLessonTimerRunning(true);
              audio.playSfx('hop');
              setScreen('map');
              setDialogue({
                expression: '응원',
                text: '지도를 따라 5개의 물 마시기 미션을 함께 깨 보자! 첫 번째 장소로 폴짝! 💧',
                waiting: false,
              });
            }}
            className="mt-4 px-10 py-3.5 rounded-full bg-gradient-to-b from-amber-300 to-amber-400 border-[3px] border-slate-900 shadow-[0_6px_0_#0F172A] hover:brightness-105 active:translate-y-1 active:shadow-[0_2px_0_#0F172A] text-[26px] xl:text-[32px] font-black text-slate-900 flex items-center gap-3 pulse-btn"
          >
            <Sparkles className="w-7 h-7" /> 모험 시작! <ArrowRight className="w-7 h-7" />
          </button>

          <p className="mt-5 text-xs xl:text-sm font-bold text-slate-400">
            단축키: [1~5] 음료 선택 · [Tab] 세은/세현 전환 · [Enter/Space] 다음 단계
          </p>
        </div>
      );
    }

    /* -------------------- BOARD-GAME STAGE MAP -------------------- */
    if (screen === 'map') {
      const nextIdx = completedStages.findIndex((c) => !c);
      const activeIdx = nextIdx === -1 ? 4 : nextIdx;
      const coords = [
        { x: 110, y: 235 },
        { x: 280, y: 120 },
        { x: 460, y: 235 },
        { x: 640, y: 120 },
        { x: 810, y: 215 },

      return (
        <div className="flex-1 min-h-0 flex flex-col justify-between bg-white/95 rounded-[28px] border-[3px] border-sky-200 shadow-lg p-4 overflow-hidden">
          <div className="flex items-center justify-between">
            <h2 className="text-[24px] xl:text-[30px] font-black text-slate-900">
              🗺️ 물방울 모험 지도
            </h2>
            <span className="px-3.5 py-1 rounded-full bg-sky-100 text-sky-800 font-black text-sm xl:text-base">
              완료 {completedStages.filter(Boolean).length} / 5

          <div className="flex-1 min-h-0 flex items-center justify-center">

                fill="none"
                stroke="#CBD5E1"
                strokeWidth="22"
                strokeLinecap="round"
              />
              <path
                d="M110 235 C180 235 200 120 280 120 C360 120 380 235 460 235 C540 235 560 120 640 120 C720 120 740 215 810 215"

                stroke="#38BDF8"

                strokeDasharray="16 14"

              {STAGES_META.map((st, idx) => {
                const pt = coords[idx];

                const isNext = idx === activeIdx;
                return (

                      {st.id}. {st.short}
                    </text>
                  </g>
                );
              })}

              <g transform={`translate(${coords[activeIdx].x - 36}, ${coords[activeIdx].y - 102})`} className="bangul-hop">
                <circle cx="36" cy="40" r="24" fill="#38BDF8" stroke="#1E293B" strokeWidth="3.5" />

                <circle cx="29" cy="40" r="3" fill="#1E293B" />
                <circle cx="43" cy="40" r="3" fill="#1E293B" />
                <path d="M30 48 Q36 54 42 48" fill="none" stroke="#1E293B" strokeWidth="2.8" strokeLinecap="round" />
              </g>
            </svg>
          </div>

          <div className="flex items-center justify-center gap-3">
            <button
              onClick={() => enterStage(activeIdx + 1)}
              className="px-7 py-2.5 rounded-full bg-amber-300 border-[3px] border-slate-900 shadow-[0_5px_0_#0F172A] active:translate-y-0.5 text-[22px] xl:text-[26px] font-black text-slate-900"
            >
              {STAGES_META[activeIdx].id}단계 "{STAGES_META[activeIdx].title}" 출발! ▶
            </button>
          </div>
        </div>
      );
    }

    /* -------------------- STAGE 1: 운동장 땀방울 대작전 -------------------- */
    if (screen === 'stage1') {
      const pState = curPlayer.stage1;
      const bothDone = players.seeun.stage1.completed && players.sehyun.stage1.completed;

      return (
        <div className="flex-1 min-h-0 flex flex-col gap-3 bg-white/95 rounded-[28px] border-[3px] border-sky-200 shadow-lg p-3.5 xl:p-4 overflow-hidden">

          <div

            className="h-[88px] xl:h-[112px] rounded-2xl bg-gradient-to-r from-sky-200 via-sky-100 to-emerald-100 border-2 border-sky-200 relative overflow-hidden shrink-0 cursor-pointer flex items-center justify-between px-5"

            <div>
              <div className="text-xs font-black text-sky-700 uppercase tracking-wide">STAGE 1</div>
              <h2 className="text-[22px] xl:text-[28px] font-black text-slate-900">
                운동장 땀방울 대작전 ⚽
              </h2>
            </div>
            <div className={`flex items-center gap-4 text-3xl xl:text-4xl ${stage1IntroActive ? 'run-across' : ''}`}>
              <span>🏃‍♀️💦</span>
              <span>🏃‍♂️💦</span>
            </div>
          </div>

          {/* Step 1: 5 Drink Cards */}
          <div>
            <div className="text-xs xl:text-sm font-black text-slate-500 mb-1.5">
              STEP 1 · {curPlayer.name}의 음료 선택 (숫자키 1~5)
            </div>
            <div className="grid grid-cols-5 gap-2">
              {DRINKS.map((d) => {
                const selected = pState.drink === d.id;
                return (
                  <button
                    key={d.id}
                    onClick={() => handleSelectDrink(d.id, activePlayer)}
                    className={`rounded-2xl border-2 p-2.5 flex flex-col items-center justify-center transition-all active:scale-95 ${
                      selected
                        ? 'bg-amber-200 border-slate-900 shadow-[0_4px_0_#0F172A] -translate-y-0.5'
                        : 'bg-slate-50 border-slate-200 hover:border-sky-400 hover:bg-sky-50'
                    }`}
                  >
                    <span className="text-3xl xl:text-4xl">{d.emoji}</span>
                    <span className="text-base xl:text-[22px] font-black text-slate-900 mt-1">{d.name}</span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Step 2: Reason Input */}
          <div className="flex-1 min-h-0 bg-slate-50 rounded-2xl border-2 border-slate-200 p-3 flex flex-col justify-between">
            <div className="flex items-center justify-between">
              <span className="text-sm xl:text-base font-black text-slate-700">
                STEP 2 · {curPlayer.name}의 이유 입력
              </span>
              {pState.completed && (
                <span className="px-2.5 py-0.5 rounded-full bg-emerald-200 text-emerald-900 text-xs font-black">
                  스티커 획득 완료 ✓
                </span>
              )}
            </div>

            <div className="flex flex-wrap gap-1.5 my-1">
              {REASON_SENTENCE_CHIPS.map((chip) => (
                <button
                  key={chip}
                  onClick={() => handleSubmitReason(chip, activePlayer)}
                  className="px-3 py-1.5 rounded-xl bg-white hover:bg-sky-100 border-2 border-sky-200 text-sm xl:text-base font-extrabold text-slate-800 shadow-sm"
                >
                  {chip}
                </button>
              ))}
              {REASON_QUICK_CHIPS.map((chip) => (
                <button
                  key={chip}
                  onClick={() => handleSubmitReason(chip, activePlayer)}
                  className="px-3 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 border-2 border-amber-300 text-sm xl:text-base font-extrabold text-amber-900 shadow-sm"
                >
                  ⚡ {chip}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-2">
              <input
                type="text"
                value={reasonDraft}
                onChange={(e) => setReasonDraft(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') handleSubmitReason(undefined, activePlayer);
                }}
                placeholder={`${curPlayer.shortName}이가 말한 이유를 직접 입력하거나 마이크를 누르세요`}
                className="flex-1 px-3.5 py-2 rounded-xl bg-white border-2 border-slate-300 text-sm xl:text-base font-bold focus:outline-none focus:border-sky-500"
              />
              <button
                onClick={toggleMic}
                className={`px-3 py-2 rounded-xl border-2 font-black flex items-center gap-1 ${
                  isListening ? 'bg-rose-500 text-white border-rose-600 animate-pulse' : 'bg-white border-slate-300 text-slate-700'
                }`}
                title="마이크 받아쓰기"
              >
                {isListening ? <MicOff className="w-5 h-5" /> : <Mic className="w-5 h-5" />}
              </button>
              <button
                onClick={() => handleSubmitReason(undefined, activePlayer)}
                className="px-5 py-2 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-black text-base shadow-sm"
              >
                입력
              </button>
              {bothDone && (
                <button
                  onClick={() => {
                    markStageDone(0);
                    setScreen('map');
                  }}
                  className="px-4 py-2 rounded-xl bg-amber-300 border-2 border-slate-900 font-black text-base text-slate-900 whitespace-nowrap"
                >
                  다음 지도로 ▶
                </button>
              )}
            </div>
            {micNotice && <div className="text-xs font-bold text-amber-700">{micNotice}</div>}
          </div>
        </div>
      );
    }

    /* -------------------- STAGE 2: 둘이 함께 물탱크 채우기 -------------------- */
    if (screen === 'stage2') {
      const tankFull = tankLevel >= 100;

      return (
        <div className="flex-1 min-h-0 flex flex-col gap-3 bg-white/95 rounded-[28px] border-[3px] border-sky-200 shadow-lg p-3.5 xl:p-4 overflow-hidden">
          <div className="flex items-center justify-between">
            <h2 className="text-[22px] xl:text-[28px] font-black text-slate-900">
              2단계 · 둘이 함께 물탱크 채우기 🤝
            </h2>
            <div className="flex items-center gap-2">
              <span className="px-3 py-1 rounded-xl bg-amber-100 text-amber-900 font-black text-base xl:text-lg flex items-center gap-1.5">
                <Clock className="w-5 h-5" /> {stage2Timer}초
              </span>
              <button
                onClick={() => setStage2TimerRunning((r) => !r)}
                className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 font-black text-sm text-slate-800"
              >
                {stage2TimerRunning ? '일시정지' : '30초 시작'}
              </button>
            </div>
          </div>

          <div className="flex-1 min-h-0 grid grid-cols-12 gap-4 items-center">
            <div className="col-span-5 h-full flex flex-col items-center justify-center">
              <div className="w-44 xl:w-52 h-44 xl:h-56 rounded-[30px] border-[4px] border-sky-400 bg-sky-50/40 relative overflow-hidden shadow-inner">
                <div
                  className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-sky-500 via-cyan-400 to-sky-300 transition-all duration-700"
                  style={{ height: `${tankLevel}%` }}
                />
                <div className="absolute inset-0 flex flex-col items-center justify-center z-10">
                  {tankFull ? (
                    <BangulAvatar expression="응원" size={88} dancing />
                  ) : (
                    <span className="text-4xl xl:text-5xl font-black text-slate-900 drop-shadow-[0_2px_0_#FFF]">
                      {tankLevel}%
                    </span>
                  )}
                  <span className="mt-1 px-3 py-0.5 rounded-full bg-white/90 text-xs xl:text-sm font-black text-sky-800 shadow-sm">
                    {tankFull ? '둘이 함께 성공! 🎉' : '경쟁 없이 함께!'}
                  </span>
                </div>
              </div>
            </div>

            <div className="col-span-7 h-full flex flex-col justify-between bg-slate-50 rounded-2xl border-2 border-slate-200 p-3">
              {!stage2AskLearned ? (
                <>
                  <div className="text-sm xl:text-base font-black text-slate-700">
                    💧 물이 좋은 이유를 한 줄씩 넣어 주세요 (지금 차례: {curPlayer.name})
                  </div>
                  <div className="flex-1 min-h-0 overflow-y-auto space-y-1.5 my-1.5">
                    {tankEntries.length === 0 ? (
                      <div className="text-sm font-bold text-slate-400 py-4 text-center">
                        아래 버튼을 누르거나 한 줄 입력하면 물탱크와 물 게이지가 함께 올라가요!
                      </div>
                    ) : (
                      tankEntries.map((item) => (
                        <div key={item.id} className="px-3 py-1.5 rounded-xl bg-white border border-slate-200 text-sm font-bold flex items-center gap-2">
                          <span className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 text-xs font-black">
                            {item.name}
                          </span>
                          <span className="truncate">{item.text}</span>
                        </div>
                      ))
                    )}
                  </div>
                  <div className="flex flex-wrap gap-1.5 my-1">
                    {STAGE2_QUICK_REASONS.map((r) => (
                      <button
                        key={r}
                        onClick={() => handleAddTankReason(r, activePlayer)}
                        className="px-2.5 py-1 rounded-xl bg-white hover:bg-sky-100 border border-sky-200 text-xs xl:text-sm font-extrabold text-slate-800"
                      >
                        + {r}
                      </button>
                    ))}
                  </div>
                  <div className="flex gap-2 mt-1">
                    <input
                      type="text"
                      value={stage2Input}
                      onChange={(e) => setStage2Input(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') handleAddTankReason(undefined, activePlayer);
                      }}
                      placeholder={`${curPlayer.shortName}이가 말한 이유 한 줄 입력`}
                      className="flex-1 px-3 py-1.5 rounded-xl bg-white border-2 border-slate-300 text-sm font-bold"
                    />
                    <button
                      onClick={() => handleAddTankReason(undefined, activePlayer)}
                      className="px-4 py-1.5 rounded-xl bg-sky-500 text-white font-black text-sm xl:text-base"
                    >
                      물 붓기 💧
                    </button>
                  </div>
                </>
              ) : (
                <div className="flex flex-col justify-between h-full">
                  <div className="text-base xl:text-xl font-black text-emerald-700">
                    🌟 방울이 질문: "친구 이야기에서 새로 알게 된 점은?"
                  </div>
                  <div className="flex flex-wrap gap-1.5 my-2">
                    {STAGE2_LEARNED_CHIPS.map((c) => (
                      <button
                        key={c}
                        onClick={() => {
                          audio.playSfx('pop');
                          setPlayers((prev) => ({
                            ...prev,
                            [activePlayer]: {
                              ...prev[activePlayer],
                              stage2: { ...prev[activePlayer].stage2, learned: c },
                            },
                          }));
                          setDialogue({
                            expression: '웃음',
                            text: `${curPlayer.shortName}아, 친구 이야기를 정말 귀 기울여 들었구나! 💛`,

                        {c}

    /* -------------------- STAGE 3: 우리 집 냉장고 유혹 탈출 -------------------- */
    if (screen === 'stage3') {

                      <span className="text-2xl xl:text-3xl">{d.emoji}</span>

          <div className="flex-1 min-h-0 bg-slate-50 rounded-2xl border-2 border-slate-200 p-3 flex flex-col justify-between">

            <div className="flex flex-wrap gap-1.5 my-1">

            <div className="flex items-center gap-2">
              <input
                type="text"
                value={reasonDraft}
                onChange={(e) => setReasonDraft(e.target.value)}

                  if (e.key === 'Enter') handleSubmitReason(undefined, activePlayer);

              {bothDone && (

                  onClick={() => {

    }

    /* -------------------- STAGE 4: 나만의 물 마시기 작전 짜기 (큰 글씨 3단계 마법사) -------------------- */
    if (screen === 'stage4') {
      const s4 = curPlayer.stage4;
      const sit = DIFFICULT_SITUATIONS.find((s) => s.id === s4.situationId);
      const bothDone = players.seeun.stage4.completed && players.sehyun.stage4.completed;

      const updateS4 = (patch) => {
        setBlankFieldAlert('');
        setPlayers((prev) => ({
          ...prev,
          [activePlayer]: {
            ...prev[activePlayer],
            stage4: { ...prev[activePlayer].stage4, ...patch },

      };

      const stepItems = [
        { num: 1, label: '① 어려운 상황' },
        { num: 2, label: '② 해결·실천 계획' },

        <div className="flex-1 min-h-0 flex flex-col gap-3 bg-white/95 rounded-[28px] border-[3px] border-sky-200 shadow-lg p-4 xl:p-5 overflow-hidden">

            {!s4.cardFlipped && (
              <div className="flex items-center gap-1.5">

          {blankFieldAlert && (
            <div className="px-4 py-2.5 rounded-2xl bg-amber-100 border-2 border-amber-400 font-black text-base xl:text-xl text-amber-950 flex items-center gap-2 shrink-0">
              <AlertCircle className="w-6 h-6 shrink-0" /> {blankFieldAlert}

          {/* Completed Gleaming Collectible Card */}
          {s4.cardFlipped ? (
            <div className="flex-1 min-h-0 flex flex-col items-center justify-center gap-4">
              <div className="w-full max-w-xl rounded-[28px] border-[3px] border-slate-900 bg-gradient-to-br from-amber-100 via-sky-100 to-emerald-100 p-5 xl:p-6 shadow-lg card-flip-in">
                <div className="flex items-center justify-between mb-2">
                  <span className="px-3.5 py-1 rounded-full bg-white text-sky-800 text-sm xl:text-base font-black">

                  </span>
                  <span className="text-3xl">✨</span>
                </div>
                <div className="text-[26px] xl:text-[34px] font-black text-slate-900 mb-3">
                  "{s4.strategyName}"

                <div className="bg-white/95 rounded-2xl p-4 space-y-1.5 text-base xl:text-xl font-bold text-slate-800">
                  <div>• 어려운 상황: {sit?.place} — {sit?.title}</div>
                  <div>• 해결 방법: {s4.solution}</div>
                  <div>• 언제 / 어디서: {s4.when} · {s4.where}</div>
                  <div>• 어떻게: {s4.how}</div>
                </div>
              </div>
              <div className="flex gap-3">
                <button
                  onClick={() => {
                    updateS4({ cardFlipped: false });
                    setStage4Step(2);
                  }}
                  className="px-5 py-2.5 rounded-xl bg-slate-100 border-2 border-slate-300 font-black text-base text-slate-700"
                >
                  내용 수정하기
                </button>
                {bothDone ? (
                  <button
                    onClick={() => {
                      markStageDone(3);
                      setScreen('map');
                    }}
                    className="px-7 py-2.5 rounded-xl bg-amber-300 border-2 border-slate-900 font-black text-xl text-slate-900"
                  >
                    5단계 지도로 이동! ▶
                  </button>
                ) : (
                  <button
                    onClick={() => {
                      setActivePlayer(activePlayer === 'seeun' ? 'sehyun' : 'seeun');
                      setStage4Step(1);
                    }}
                    className="px-7 py-2.5 rounded-xl bg-sky-500 text-white font-black text-xl"
                  >
                    다음 친구 작전 짜기 ▶
                  </button>
                )}
              </div>
            </div>
          ) : stage4Step === 1 ? (
            /* ---------- STEP 4-1: Big, Clear 6 Situation Cards ---------- */
            <div className="flex-1 min-h-0 flex flex-col justify-between gap-3">
              <div className="bg-sky-50 rounded-2xl border border-sky-200 px-4 py-2.5 text-center">
                <div className="text-[20px] xl:text-[26px] font-black text-slate-900">
                  언제 물 마시기가 제일 어려워요? 카드 1개를 골라 주세요!
                </div>
              </div>

              <div className="flex-1 min-h-0 grid grid-cols-3 gap-3">
                {DIFFICULT_SITUATIONS.map((item) => {
                  const selected = s4.situationId === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => {
                        audio.playSfx('pop');
                        updateS4({
                          situationId: item.id,
                          solution: item.solutions[0],
                          when: item.defaults.when,
                          where: item.defaults.where,
                          how: item.defaults.how,
                          strategyName: item.recommendedNames[0],
                        });
                        setStage4Step(2);
                        setDialogue({
                          expression: '웃음',
                          text: `${curPlayer.shortName}아, "${item.title}" 상황이 어렵구나! 이제 해결 방법과 실천 계획을 정해 보자! ✨`,
                          waiting: false,
                        });
                      }}
                      className={`p-3.5 xl:p-4 rounded-2xl border-[3px] flex flex-col items-center justify-center text-center gap-1.5 transition-all active:scale-95 ${
                        selected
                          ? 'bg-amber-100 border-slate-900 shadow-md'
                          : 'bg-slate-50 border-slate-200 hover:border-sky-400 hover:bg-sky-50'
                      }`}
                    >
                      <span className="text-4xl xl:text-5xl">{item.emoji}</span>
                      <span
                        className={`px-2.5 py-0.5 rounded-full text-xs xl:text-sm font-black flex items-center gap-1 ${
                          item.place === '학교' ? 'bg-sky-100 text-sky-800' : 'bg-emerald-100 text-emerald-800'
                        }`}
                      >
                        {item.place === '학교' ? <School className="w-3.5 h-3.5" /> : <Home className="w-3.5 h-3.5" />}
                        {item.place}
                      </span>
                      <span className="text-[18px] xl:text-[22px] font-black text-slate-900 leading-snug">
                        {item.title}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>
          ) : stage4Step === 2 && sit ? (
            /* ---------- STEP 4-2: Big Solution Cards + When/Where/How ---------- */
            <div className="flex-1 min-h-0 flex flex-col justify-between gap-3">
              <div className="flex items-center justify-between bg-emerald-50 rounded-2xl border border-emerald-200 px-4 py-2">
                <span className="text-base xl:text-xl font-black text-slate-900">
                  고른 상황: {sit.emoji} {sit.title}
                </span>
                <span className="text-sm xl:text-base font-black text-emerald-800">
                  💧 정수기 · 수돗물 · 물병 모두 OK!
                </span>
              </div>

              {/* Solution Cards */}
              <div>
                <div className="text-base xl:text-lg font-black text-slate-700 mb-1.5">
                  💡 어떤 해결 방법으로 해 볼까요?
                </div>
                <div className="grid grid-cols-2 gap-2.5">
                  {sit.solutions.map((sol) => (
                    <button
                      key={sol}
                      onClick={() => updateS4({ solution: sol })}
                      className={`p-3 rounded-2xl border-2 text-left text-base xl:text-xl font-black transition-all ${
                        s4.solution === sol
                          ? 'bg-emerald-200 border-slate-900 text-slate-900 shadow-sm'
                          : 'bg-slate-50 border-slate-200 text-slate-700 hover:border-emerald-400'
                      }`}
                    >
                      ✓ {sol}
                    </button>
                  ))}
                </div>
              </div>

              {/* Large When / Where / How Inputs */}
              <div className="grid grid-cols-3 gap-3">
                <div className="bg-slate-50 rounded-2xl border-2 border-slate-200 p-2.5">
                  <label className="block text-base xl:text-lg font-black text-sky-700 mb-1">⏰ 언제</label>
                  <input
                    type="text"
                    value={s4.when}
                    onChange={(e) => updateS4({ when: e.target.value })}
                    placeholder="예: 쉬는 시간마다"
                    className="w-full px-3 py-2 rounded-xl bg-white border-2 border-slate-300 text-base xl:text-lg font-bold text-slate-900"
                  />
                </div>
                <div className="bg-slate-50 rounded-2xl border-2 border-slate-200 p-2.5">
                  <label className="block text-base xl:text-lg font-black text-emerald-700 mb-1">📍 어디서</label>
                  <input
                    type="text"
                    value={s4.where}
                    onChange={(e) => updateS4({ where: e.target.value })}
                    placeholder="예: 교실 정수기에서"
                    className="w-full px-3 py-2 rounded-xl bg-white border-2 border-slate-300 text-base xl:text-lg font-bold text-slate-900"
                  />
                </div>
                <div className="bg-slate-50 rounded-2xl border-2 border-slate-200 p-2.5">
                  <label className="block text-base xl:text-lg font-black text-amber-700 mb-1">💧 어떻게</label>
                  <input
                    type="text"
                    value={s4.how}
                    onChange={(e) => updateS4({ how: e.target.value })}
                    placeholder="예: 물 한 컵 마시기"
                    className="w-full px-3 py-2 rounded-xl bg-white border-2 border-slate-300 text-base xl:text-lg font-bold text-slate-900"
                  />
