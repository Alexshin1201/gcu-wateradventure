              </div>

              <div className="flex items-center justify-between">
                <button
                  onClick={() => setStage4Step(1)}
                  className="px-5 py-2.5 rounded-xl bg-slate-100 border-2 border-slate-300 font-black text-base xl:text-lg text-slate-700"
                >
                  ◀ 상황 다시 고르기
                </button>
                <button
                  onClick={() => {
                    if (!s4.when.trim()) {
                      setBlankFieldAlert(`"${curPlayer.shortName}아, [언제] 마실지 한 번 더 물어봐 주세요!"`);
                      return;
                    }
                    if (!s4.where.trim()) {
                      setBlankFieldAlert(`"${curPlayer.shortName}아, [어디서] 마실지 한 번 더 물어봐 주세요!"`);
                      return;
                    }
                    if (!s4.how.trim()) {
                      setBlankFieldAlert(`"${curPlayer.shortName}아, [어떻게] 마실지 한 번 더 물어봐 주세요!"`);
                      return;
                    }
                    setStage4Step(3);
                    setDialogue({
                      expression: '응원',
                      text: `정말 구체적이야! 이제 ${curPlayer.shortName}이만의 멋진 작전 이름을 지어 보자! 🏷️`,
                      waiting: false,
                    });
                  }}
                  className="px-7 py-2.5 rounded-xl bg-sky-500 text-white font-black text-lg xl:text-xl shadow-sm"
                >
                  다음: 작전 이름 짓기 ▶
                </button>
              </div>
            </div>
          ) : (
            /* ---------- STEP 4-3: Big Strategy Name & Complete Card ---------- */
            <div className="flex-1 min-h-0 flex flex-col justify-between gap-3">
              <div className="bg-amber-50 rounded-2xl border-2 border-amber-200 p-4 text-center">
                <div className="text-[20px] xl:text-[26px] font-black text-slate-900 mb-3">
                  🏷️ {curPlayer.name}의 멋진 작전 이름을 지어 주세요!
                </div>
                <input
                  type="text"
                  value={s4.strategyName}
                  onChange={(e) => updateS4({ strategyName: e.target.value })}
                  placeholder="예: TV 탐정 물컵 작전"
                  className="w-full max-w-lg px-4 py-3 rounded-2xl bg-white border-[3px] border-slate-900 text-[22px] xl:text-[28px] font-black text-center text-slate-900"
                />
              </div>

              {sit && (
                <div>
                  <div className="text-base xl:text-lg font-black text-slate-600 mb-2 text-center">
                    추천 이름에서 바로 고를 수도 있어요!
                  </div>
                  <div className="grid grid-cols-3 gap-2.5">
                    {sit.recommendedNames.map((n) => (
                      <button
                        key={n}
                        onClick={() => updateS4({ strategyName: n })}
                        className={`p-3 rounded-2xl border-2 text-base xl:text-xl font-black transition-all ${
                          s4.strategyName === n
                            ? 'bg-amber-200 border-slate-900 text-slate-900'
                            : 'bg-slate-50 border-slate-200 hover:border-amber-400 text-slate-800'
                        }`}
                      >
                        ✨ {n}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              <div className="flex items-center justify-between">
                <button
                  onClick={() => setStage4Step(2)}
                  className="px-5 py-2.5 rounded-xl bg-slate-100 border-2 border-slate-300 font-black text-base xl:text-lg text-slate-700"
                >
                  ◀ 실천 계획 수정
                </button>
                <button
                  onClick={() => handleCompleteStrategy(activePlayer)}
                  className="px-8 py-3 rounded-2xl bg-amber-300 border-[3px] border-slate-900 shadow-[0_4px_0_#0F172A] font-black text-xl xl:text-2xl text-slate-900"
                >
                  ✨ 작전 카드 완성하기!
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* -------------------- STAGE 5: 복습 퀴즈로 방울이 화분 키우기 + 가정 안내 -------------------- */
    if (screen === 'stage5') {
      const currentQuiz = REVIEW_QUIZ_ITEMS[stage5QuizIdx];
      const bothFinishedAll = players.seeun.stage5.completed && players.sehyun.stage5.completed;

      const renderPlantSvg = (stage) => (
        <svg viewBox="0 0 120 112" className="w-24 h-24 xl:w-28 xl:h-28 mx-auto">
          {/* Pot */}
          <path d="M35 78 L85 78 L78 106 L42 106 Z" fill="#F97316" stroke="#1E293B" strokeWidth="3" />
          <rect x="30" y="70" width="60" height="10" rx="4" fill="#FB923C" stroke="#1E293B" strokeWidth="3" />
          {/* Stage 0: Seed */}
          {stage === 0 && (
            <ellipse cx="60" cy="64" rx="8" ry="5" fill="#A16207" stroke="#1E293B" strokeWidth="2.5" />
          )}
          {/* Stage 1+: Sprout & Stem */}
          {stage >= 1 && (
            <>
              <line x1="60" y1="70" x2="60" y2={stage >= 2 ? 32 : 48} stroke="#16A34A" strokeWidth="5.5" strokeLinecap="round" />
              <ellipse cx="47" cy="54" rx="12" ry="6.5" transform="rotate(-25 47 54)" fill="#4ADE80" stroke="#1E293B" strokeWidth="2.5" />
              <ellipse cx="73" cy="54" rx="12" ry="6.5" transform="rotate(25 73 54)" fill="#4ADE80" stroke="#1E293B" strokeWidth="2.5" />
            </>
          )}
          {/* Stage 2+: Bigger leaves + bud */}
          {stage >= 2 && (
            <>
              <ellipse cx="44" cy="40" rx="11" ry="6" transform="rotate(-35 44 40)" fill="#22C55E" stroke="#1E293B" strokeWidth="2.5" />
              <ellipse cx="76" cy="40" rx="11" ry="6" transform="rotate(35 76 40)" fill="#22C55E" stroke="#1E293B" strokeWidth="2.5" />
            </>
          )}
          {/* Stage 3: Full blooming water-drop flower! */}
          {stage >= 3 && (
            <g className="sticker-pop">
              <circle cx="60" cy="22" r="15" fill="#38BDF8" stroke="#1E293B" strokeWidth="3" />
              <circle cx="60" cy="22" r="6.5" fill="#FDE047" />
              <text x="86" y="24" fontSize="20">✨</text>
              <text x="18" y="26" fontSize="18">💧</text>
            </g>
          )}
        </svg>

              onChange={(e) => setApiKeyDraft(e.target.value)}
              placeholder="AIza..."
              className="w-full px-3 py-2 rounded-xl border-2 border-slate-300 text-sm font-bold mb-3"
            />
            <div className="flex justify-end gap-2">
              <button
                onClick={() => {
                  setGeminiApiKey('');
                  setApiKeyDraft('');
                  try {
                    localStorage.removeItem('bangul_gemini_key');
                  } catch {
                    // ignore
                  }
                  setShowApiModal(false);
                }}
                className="px-4 py-1.5 rounded-xl bg-slate-100 text-sm font-black text-slate-700"
              >
                키 지우기
              </button>
              <button
                onClick={() => {
                  setGeminiApiKey(apiKeyDraft.trim());
                  try {
                    localStorage.setItem('bangul_gemini_key', apiKeyDraft.trim());
                  } catch {
                    // ignore
                  }
                  setShowApiModal(false);
                }}
                className="px-4 py-1.5 rounded-xl bg-sky-500 text-white text-sm font-black"
              >
                저장
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const rootEl = document.getElementById('root');
if (rootEl) {
  ReactDOM.createRoot(rootEl).render(<App />);
}
  </script>
</body>
</html>
